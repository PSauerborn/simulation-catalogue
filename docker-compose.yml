services:
  postgres:
    image: postgres:17
    container_name: simulation-catalogue-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-simulation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simulation}
      POSTGRES_DB: ${POSTGRES_DB:-simulation_catalogue}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-simulation} -d ${POSTGRES_DB:-simulation_catalogue}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
